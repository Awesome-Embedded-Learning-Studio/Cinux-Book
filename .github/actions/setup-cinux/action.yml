name: Setup Cinux build
description: Install the GCC 14 toolchain, restore source/compiler caches and check KVM when required.

inputs:
  kvm:
    description: Require an accessible KVM device for this job.
    default: 'false'
  cache-key:
    description: Cell name used to keep concurrent compiler cache saves independent.
    required: true
  wayland:
    description: Build the wayland stack Vesper's compositor lane requires, since ubuntu-24.04 only ships 1.22.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-14 g++-14 gcc-14-multilib g++-14-multilib \
          ccache cmake ninja-build make binutils libc6-dev python3 curl bzip2 xz-utils \
          qemu-system-x86 e2fsprogs file bc bison flex rsync cpio unzip \
          libncurses-dev libssl-dev libarchive-dev pkg-config

    - name: Build the wayland stack Vesper requires
      if: inputs.wayland == 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get install -y meson libffi-dev libxcb1-dev libxcb-composite0-dev wayland-protocols
        wayland_version=1.26.0
        wayland_build="$RUNNER_TEMP/wayland-$wayland_version"
        mkdir -p "$wayland_build"
        curl -fsSL --retry 3 \
          "https://gitlab.freedesktop.org/wayland/wayland/-/archive/$wayland_version/wayland-$wayland_version.tar.gz" \
          | tar -xzf - -C "$wayland_build"
        meson setup "$wayland_build/out" "$wayland_build/wayland-$wayland_version" \
          -Dlibdir=lib/x86_64-linux-gnu \
          -Dtests=false -Ddocumentation=false -Ddtd_validation=false
        meson compile -C "$wayland_build/out"
        sudo meson install -C "$wayland_build/out"
        echo 'PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/share/pkgconfig' >> "$GITHUB_ENV"

    - name: Select matching compiler tools
      shell: bash
      run: |
        toolchain_dir="$RUNNER_TEMP/cinux-toolchain"
        mkdir -p "$toolchain_dir"
        ln -s "$(command -v gcc-14)" "$toolchain_dir/gcc"
        ln -s "$(command -v g++-14)" "$toolchain_dir/g++"
        ln -s "$(command -v cpp-14)" "$toolchain_dir/cpp"
        echo "$toolchain_dir" >> "$GITHUB_PATH"
        echo 'CC=gcc-14' >> "$GITHUB_ENV"
        echo 'CXX=g++-14' >> "$GITHUB_ENV"
        echo 'CINUX_GCC_BIN=gcc-14' >> "$GITHUB_ENV"
        echo 'CINUX_GXX_BIN=g++-14' >> "$GITHUB_ENV"
        echo 'CINUX_COMPILER_LAUNCHER=ccache' >> "$GITHUB_ENV"
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache" >> "$GITHUB_ENV"

    - name: Restore compiler cache
      uses: actions/cache@v4
      with:
        path: .cache/ccache
        key: ccache-v2-${{ runner.os }}-${{ inputs.cache-key }}-${{ github.sha }}
        restore-keys: |
          ccache-v2-${{ runner.os }}-${{ inputs.cache-key }}-

    - name: Restore rootfs downloads
      uses: actions/cache@v4
      with:
        path: .cache/rootfs
        key: rootfs-v2-${{ runner.os }}-${{ hashFiles('scripts/build-busybox-glibc.sh', 'user/rootfs/buildroot/source.json', 'user/rootfs/buildroot/configs/**') }}

    - name: Check KVM access
      if: inputs.kvm == 'true'
      shell: bash
      run: |
        test -c /dev/kvm || { echo 'This job requires /dev/kvm; TCG fallback is disabled' >&2; exit 1; }
        sudo chmod a+rw /dev/kvm
        test -r /dev/kvm && test -w /dev/kvm
        python3 - <<'PY'
        import fcntl
        import os
        descriptor = os.open('/dev/kvm', os.O_RDWR)
        try:
            assert fcntl.ioctl(descriptor, 0xAE00, 0) == 12, 'unsupported KVM API'
        finally:
            os.close(descriptor)
        PY

    - name: Show tool versions
      shell: bash
      run: |
        gcc --version
        g++ --version
        cmake --version
        qemu-system-x86_64 --version
        ccache --max-size=1G
