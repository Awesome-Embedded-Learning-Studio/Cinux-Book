name: Setup Cinux build
description: Install the selected GCC toolchain, restore source/compiler caches and check KVM when required.

inputs:
  gcc-version:
    description: GCC major version to install from the runner's package sources.
    default: '14'
  kvm:
    description: Require an accessible KVM device for this job.
    default: 'false'
  cache-key:
    description: Cell name used to keep concurrent compiler cache saves independent.
    required: true

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      env:
        GCC_VERSION: ${{ inputs.gcc-version }}
      run: |
        if [[ ! "$GCC_VERSION" =~ ^[0-9]+$ ]]; then
          echo "Expected a GCC major version, got: $GCC_VERSION" >&2
          exit 1
        fi
        sudo apt-get update
        sudo apt-get install -y "gcc-$GCC_VERSION" "g++-$GCC_VERSION" \
          "gcc-$GCC_VERSION-multilib" "g++-$GCC_VERSION-multilib" \
          ccache cmake ninja-build make binutils libc6-dev python3 curl bzip2 xz-utils \
          qemu-system-x86 e2fsprogs file bc bison flex rsync cpio unzip iputils-ping \
          libncurses-dev libssl-dev libarchive-dev pkg-config

    - name: Select matching compiler tools
      shell: bash
      env:
        GCC_VERSION: ${{ inputs.gcc-version }}
      run: |
        toolchain_dir="$RUNNER_TEMP/cinux-toolchain"
        cc="gcc-$GCC_VERSION"
        cxx="g++-$GCC_VERSION"
        cpp="cpp-$GCC_VERSION"
        cc_path=$(command -v "$cc")
        cxx_path=$(command -v "$cxx")
        cpp_path=$(command -v "$cpp")
        mkdir -p "$toolchain_dir"
        ln -s "$cc_path" "$toolchain_dir/gcc"
        ln -s "$cxx_path" "$toolchain_dir/g++"
        ln -s "$cpp_path" "$toolchain_dir/cpp"
        echo "$toolchain_dir" >> "$GITHUB_PATH"
        printf 'CC=%s\nCXX=%s\nCINUX_GCC_BIN=%s\nCINUX_GXX_BIN=%s\n' \
          "$cc" "$cxx" "$cc" "$cxx" >> "$GITHUB_ENV"
        echo 'CINUX_COMPILER_LAUNCHER=ccache' >> "$GITHUB_ENV"
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache" >> "$GITHUB_ENV"

    - name: Restore compiler cache
      uses: actions/cache@v4
      with:
        path: .cache/ccache
        key: ccache-v2-${{ runner.os }}-${{ inputs.cache-key }}-${{ github.sha }}
        restore-keys: |
          ccache-v2-${{ runner.os }}-${{ inputs.cache-key }}-

    - name: Restore rootfs downloads
      uses: actions/cache@v4
      with:
        path: .cache/rootfs
        key: rootfs-v2-${{ runner.os }}-${{ hashFiles('scripts/build-busybox-glibc.sh', 'user/rootfs/buildroot/source.json', 'user/rootfs/buildroot/configs/**') }}

    - name: Check KVM access
      if: inputs.kvm == 'true'
      shell: bash
      run: |
        test -c /dev/kvm || { echo 'This job requires /dev/kvm; TCG fallback is disabled' >&2; exit 1; }
        sudo chmod a+rw /dev/kvm
        test -r /dev/kvm && test -w /dev/kvm
        python3 - <<'PY'
        import fcntl
        import os
        descriptor = os.open('/dev/kvm', os.O_RDWR)
        try:
            assert fcntl.ioctl(descriptor, 0xAE00, 0) == 12, 'unsupported KVM API'
        finally:
            os.close(descriptor)
        PY

    - name: Show tool versions
      shell: bash
      run: |
        gcc --version
        g++ --version
        cmake --version
        qemu-system-x86_64 --version
        ccache --max-size=1G
