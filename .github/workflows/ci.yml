name: Cinux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Unrelated label events must not cancel the actual CI run for this PR.
  group: >-
    ci-${{ github.workflow }}-${{
      ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
       github.event.label.name != 'full') && github.run_id || github.ref
    }}
  cancel-in-progress: true

jobs:
  test-infrastructure:
    if: &ci-event >-
      ${{ (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
          github.event.label.name == 'full' }}
    name: test-infrastructure (GCC ${{ matrix.toolchain.gcc }})
    runs-on: ${{ matrix.toolchain.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        toolchain: &selected-toolchains >-
          ${{ fromJSON(
            github.event_name == 'pull_request' &&
            contains(github.event.pull_request.labels.*.name, 'full') &&
            '[{"runner":"ubuntu-24.04","gcc":"14"},{"runner":"ubuntu-26.04","gcc":"15"},{"runner":"ubuntu-26.04","gcc":"16"}]' ||
            '[{"runner":"ubuntu-24.04","gcc":"14"}]'
          ) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools for the CI infrastructure tests
        env:
          CXX: g++-${{ matrix.toolchain.gcc }}
        run: |
          sudo apt-get update
          sudo apt-get install -y "$CXX" e2fsprogs
          "$CXX" --version
      - name: Check test orchestration and failure handling
        env:
          CXX: g++-${{ matrix.toolchain.gcc }}
        run: |
          bash -n scripts/checks/acceptance.sh scripts/checks/matrix.sh scripts/checks/run-cell.sh scripts/checks/setup-mke2fs.sh
          python3 -m unittest discover -s test/tools -p 'test_ci_checks.py' -v

  host-tests:
    name: host (Release, ${{ matrix.sanitizer }}, GCC ${{ matrix.toolchain.gcc }})
    if: *ci-event
    runs-on: ${{ matrix.toolchain.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        toolchain: *selected-toolchains
        sanitizer: [asan, tsan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-cinux
        with:
          gcc-version: ${{ matrix.toolchain.gcc }}
          cache-key: host-${{ matrix.sanitizer }}-${{ matrix.toolchain.runner }}-gcc${{ matrix.toolchain.gcc }}
      - name: Run host sanitizer cell
        env:
          CINUX_CHECK_JOBS: '4'
        run: bash scripts/checks/run-cell.sh host Release ${{ matrix.sanitizer }} build-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-${{ matrix.sanitizer }}-gcc${{ matrix.toolchain.gcc }}-logs
          path: |
            build-ci/test/Testing/Temporary/
            build-ci/test-inventory.json
            build-ci/CMakeCache.txt

  kernel-tests:
    name: kernel (${{ matrix.build_type }}, ${{ matrix.checks }}, GCC ${{ matrix.toolchain.gcc }})
    if: *ci-event
    runs-on: ${{ matrix.toolchain.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: *selected-toolchains
        build_type: [Debug, Release]
        checks: [none, ubsan, lockdep]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-cinux
        with:
          gcc-version: ${{ matrix.toolchain.gcc }}
          kvm: 'true'
          cache-key: kernel-${{ matrix.build_type }}-${{ matrix.checks }}-${{ matrix.toolchain.runner }}-gcc${{ matrix.toolchain.gcc }}
      - name: Run host and single/dual CPU kernel tests
        env:
          CINUX_CHECK_JOBS: '4'
        run: bash scripts/checks/run-cell.sh kernel ${{ matrix.build_type }} ${{ matrix.checks }} build-ci
      - name: Boot the production kernel and run the existing BusyBox checks
        run: python3 scripts/test_station33_ecosystem.py --image build-ci/boot/cinux.img
      - name: Trace the failed guest across the whole boot path
        if: failure() && matrix.build_type == 'Debug' && matrix.checks == 'none'
        run: |
          sudo apt-get install -y -q gdb || { sudo apt-get update -q && sudo apt-get install -y -q gdb; }
          cmake --build build-ci --parallel 2 --target boot_image ext2_img qemu_disks
          mapfile -t qemu_command < build-ci/qemu-command.txt
          mapfile -t qemu_devices < build-ci/qemu-device-args.txt
          objdump -d --disassemble=LmEntry build-ci/boot/lm_blob > build-ci/autopsy-lm.txt
          lm_jump=$(awk '/jmp[q]?[[:space:]]+\*%rax/ {sub(/:$/, "", $1); print "0x" $1; exit}' build-ci/autopsy-lm.txt)
          test -n "$lm_jump"
          "${qemu_command[@]}" "${qemu_devices[@]}" \
            -snapshot -drive format=raw,file=build-ci/boot/cinux.img \
            -serial file:build-ci/autopsy-serial.log -monitor none \
            -d int,cpu_reset -D build-ci/autopsy-qemu.log \
            -S -no-shutdown -gdb tcp:127.0.0.1:1234 \
            > build-ci/autopsy-qemu-console.log 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true; wait "$qemu_pid" 2>/dev/null || true' EXIT
          timeout --kill-after=5s 300s stdbuf -oL -eL gdb -batch -nx build-ci/kernel/cinux_kernel \
            -ex 'set pagination off' \
            -ex 'set confirm off' \
            -ex 'set tcp auto-retry on' \
            -ex 'set tcp connect-timeout 10' \
            -ex 'target remote 127.0.0.1:1234' \
            -ex "hbreak *$lm_jump" \
            -ex continue \
            -ex 'echo === Long-mode handoff jump ===\n' \
            -ex 'x/4wx 0x4f00' \
            -ex 'info registers rip rax rdi rsp cr0 cr3 cr4' \
            -ex 'delete breakpoints' \
            -x scripts/checks/boot-stations.gdb \
            > build-ci/autopsy-gdb.txt 2>&1 || echo "GDB exit status: $?"
          echo '=== autopsy serial ==='
          cat build-ci/autopsy-serial.log || true
          echo '=== autopsy gdb ==='
          cat build-ci/autopsy-gdb.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-${{ matrix.build_type }}-${{ matrix.checks }}-gcc${{ matrix.toolchain.gcc }}-logs
          path: |
            build-ci/test/Testing/Temporary/
            build-ci/test/kernel_test_*/serial.log
            build-ci/station33-ecosystem.serial.log
            build-ci/autopsy-serial.log
            build-ci/autopsy-qemu.log
            build-ci/autopsy-qemu-console.log
            build-ci/autopsy-lm.txt
            build-ci/autopsy-gdb.txt
            build-ci/test-inventory.json
            build-ci/CMakeCache.txt
            build-ci/qemu-device-args.txt
            build-ci/qemu-command.txt

  ecosystem:
    name: ecosystem (Release, ${{ matrix.checks }}, GCC ${{ matrix.toolchain.gcc }})
    if: *ci-event
    runs-on: ${{ matrix.toolchain.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: *selected-toolchains
        checks: [none, checks]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-cinux
        with:
          gcc-version: ${{ matrix.toolchain.gcc }}
          kvm: 'true'
          cache-key: ecosystem-${{ matrix.checks }}-${{ matrix.toolchain.runner }}-gcc${{ matrix.toolchain.gcc }}
      - name: Check combined instrumentation on the host and in kernel tests
        if: matrix.checks == 'checks'
        env:
          CINUX_CHECK_JOBS: '4'
        run: bash scripts/checks/run-cell.sh kernel Release checks build-ci
      - name: Run existing userland, network and GUI checks
        env:
          CINUX_CHECK_JOBS: '4'
        run: bash scripts/checks/run-cell.sh ecosystem Release ${{ matrix.checks }} build-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecosystem-${{ matrix.checks }}-gcc${{ matrix.toolchain.gcc }}-logs
          path: |
            build-ci/*.log
            build-ci/test/Testing/Temporary/
            build-ci/test/kernel_test_*/serial.log
            build-ci/tcp-smoke/
            build-ci/station35/*.ppm
            build-ci/test-inventory.json
            build-ci/CMakeCache.txt
            build-ci/qemu-device-args.txt

  # ── 文档构建验证(Cinux-Book 特有)──────────────────────────────

  docs:
    if: *ci-event
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0   # getBuildInfo 需要 git tag 取页脚版本号
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: site/.vitepress/.build-cache
          key: cinux-build-${{ runner.os }}-${{ hashFiles('document/**', 'site/.vitepress/config/**', 'site/.vitepress/plugins/**', 'site/.vitepress/public/**', 'site/.vitepress/theme/**', 'project.config.ts', 'scripts/build.ts', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            cinux-build-${{ runner.os }}-
      - name: Build docs
        run: pnpm build
        env:
          BUILD_CONCURRENCY: '3'
