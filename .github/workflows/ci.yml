name: Cinux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check test orchestration and failure handling
        run: |
          bash -n scripts/checks/acceptance.sh scripts/checks/matrix.sh scripts/checks/run-cell.sh scripts/checks/setup-mke2fs.sh
          python3 -m unittest discover -s test/tools -p 'test_ci_checks.py' -v

  host-tests:
    name: host (Release, ${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-cinux
        with:
          cache-key: host-${{ matrix.sanitizer }}
      - name: Run host sanitizer cell
        env:
          CINUX_CHECK_JOBS: '4'
        run: bash scripts/checks/run-cell.sh host Release ${{ matrix.sanitizer }} build-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-${{ matrix.sanitizer }}-logs
          path: |
            build-ci/test/Testing/Temporary/
            build-ci/test-inventory.json
            build-ci/CMakeCache.txt

  kernel-tests:
    name: kernel (${{ matrix.build_type }}, ${{ matrix.checks }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        checks: [none, ubsan, lockdep]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-cinux
        with:
          kvm: 'true'
          cache-key: kernel-${{ matrix.build_type }}-${{ matrix.checks }}
      - name: Run host and single/dual CPU kernel tests
        env:
          CINUX_CHECK_JOBS: '4'
        run: bash scripts/checks/run-cell.sh kernel ${{ matrix.build_type }} ${{ matrix.checks }} build-ci
      - name: Boot the production kernel and run the existing BusyBox checks
        run: python3 scripts/test_station33_ecosystem.py --image build-ci/boot/cinux.img
      - name: Autopsy the frozen guest via QEMU gdbstub
        if: failure() && matrix.build_type == 'Debug' && matrix.checks == 'none'
        run: |
          sudo apt-get install -y -q gdb || { sudo apt-get update -q && sudo apt-get install -y -q gdb; }
          if [ ! -f build-ci/boot/cinux.img ]; then
            cmake --build build-ci --parallel 2 --target boot_image ext2_img qemu_disks
          fi
          kelf=$(find build-ci -maxdepth 2 -type f -name cinux_kernel | head -1)
          echo "kernel elf: ${kelf:-none}"
          qemu-system-x86_64 $(tr '\n' ' ' < build-ci/qemu-device-args.txt) \
            -snapshot -drive format=raw,file=build-ci/boot/cinux.img \
            -serial file:build-ci/autopsy-serial.log -monitor none \
            -gdb tcp::1234 &
          qemu_pid=$!
          sleep 45
          for sample in 1 2; do
            echo "=== gdb sample $sample ===" >> build-ci/autopsy-gdb.txt
            gdb -batch -nx \
              -ex 'set pagination off' \
              -ex 'set architecture i386:x86-64' \
              -ex "file $kelf" \
              -ex 'target remote :1234' \
              -ex 'info threads' \
              -ex 'thread apply all bt' \
              -ex 'thread apply all info registers rip rbp rsp rdx rsi rdi r12 r13 rcx' \
              -ex 'thread apply all x/4i $pc-8' \
              >> build-ci/autopsy-gdb.txt 2>&1 || true
            sleep 3
          done
          kill "$qemu_pid" || true
          echo '=== autopsy serial ==='
          cat build-ci/autopsy-serial.log || true
          echo '=== autopsy gdb ==='
          cat build-ci/autopsy-gdb.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-${{ matrix.build_type }}-${{ matrix.checks }}-logs
          path: |
            build-ci/test/Testing/Temporary/
            build-ci/test/kernel_test_*/serial.log
            build-ci/station33-ecosystem.serial.log
            build-ci/autopsy-serial.log
            build-ci/autopsy-gdb.txt
            build-ci/test-inventory.json
            build-ci/CMakeCache.txt
            build-ci/qemu-device-args.txt

  ecosystem:
    name: ecosystem (Release, ${{ matrix.checks }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        checks: [none, checks]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-cinux
        with:
          kvm: 'true'
          cache-key: ecosystem-${{ matrix.checks }}
      - name: Check combined instrumentation on the host and in kernel tests
        if: matrix.checks == 'checks'
        env:
          CINUX_CHECK_JOBS: '4'
        run: bash scripts/checks/run-cell.sh kernel Release checks build-ci
      - name: Run existing userland, network and GUI checks
        env:
          CINUX_CHECK_JOBS: '4'
        run: bash scripts/checks/run-cell.sh ecosystem Release ${{ matrix.checks }} build-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecosystem-${{ matrix.checks }}-logs
          path: |
            build-ci/*.log
            build-ci/test/Testing/Temporary/
            build-ci/test/kernel_test_*/serial.log
            build-ci/tcp-smoke/
            build-ci/station35/*.ppm
            build-ci/test-inventory.json
            build-ci/CMakeCache.txt
            build-ci/qemu-device-args.txt

  # ── 文档构建验证(Cinux-Book 特有)──────────────────────────────

  docs:
    # VitePress 分卷并发构建 + dead-link 隐式检查(build 报断链即失败)。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0   # getBuildInfo 需要 git tag 取页脚版本号
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: site/.vitepress/.build-cache
          key: cinux-build-${{ runner.os }}-${{ hashFiles('document/**', 'site/.vitepress/config/**', 'site/.vitepress/plugins/**', 'site/.vitepress/public/**', 'site/.vitepress/theme/**', 'project.config.ts', 'scripts/build.ts', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            cinux-build-${{ runner.os }}-
      - name: Build docs
        run: pnpm build
        env:
          BUILD_CONCURRENCY: '3'
