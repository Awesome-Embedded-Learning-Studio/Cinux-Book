name: Cinux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  # ── 文档构建验证(Cinux-Book 特有)──────────────────────────────

  docs:
    # VitePress 分卷并发构建 + dead-link 隐式检查(build 报断链即失败)。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0   # getBuildInfo 需要 git tag 取页脚版本号
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: site/.vitepress/.build-cache
          key: cinux-build-${{ runner.os }}-${{ hashFiles('document/**', 'site/.vitepress/config/**', 'site/.vitepress/plugins/**', 'site/.vitepress/public/**', 'site/.vitepress/theme/**', 'project.config.ts', 'scripts/build.ts', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            cinux-build-${{ runner.os }}-
      - name: Build docs
        run: pnpm build
        env:
          BUILD_CONCURRENCY: '3'
